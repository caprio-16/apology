<title>Ryu's Peacock Garden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400;1,9..144,500&family=Nunito:wght@500;700&display=swap">
<style>
/* Layout: one full-screen night garden. Bokeh canvas behind, a glass message card first, then the flower garden with a peacock fan rises in its place. Single dark look by choice. */
:root {
  --ink: #05202a;
  --deep: #0b3f4a;
  --teal: #1fb5ac;
  --azure: #2f86d6;
  --gold: #f4c65a;
  --blush: #ff9eb8;
  --lilac: #c7a8ff;
  --text: #f2fbf8;
  --muted: #a9d3cf;
  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  position: relative;
  overflow: hidden;
  background: var(--ink);
  background-image: radial-gradient(120% 90% at 50% 20%, var(--deep) 0%, var(--ink) 70%);
  color: var(--text);
  font-family: var(--font-body);
}
#bokeh { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
.layer {
  position: absolute; inset: 0; z-index: 1;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  box-sizing: border-box;
}

/* ---------- message card ---------- */
.intro { display: grid; place-items: center; transition: opacity .7s ease, transform .7s ease; }
.intro.gone { opacity: 0; transform: scale(.96); pointer-events: none; }
.card {
  width: min(100%, 430px);
  box-sizing: border-box;
  padding: 34px 28px 28px;
  border-radius: 30px;
  background: linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
  border: 1px solid rgba(255,255,255,.22);
  box-shadow: 0 30px 80px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  text-align: center;
  animation: cardIn 1s cubic-bezier(.2,.8,.2,1) both;
}
.card .feather { width: 64px; height: 64px; margin: -64px auto 14px; display: block; filter: drop-shadow(0 6px 14px rgba(31,181,172,.55)); }
.hello {
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 500;
  font-size: clamp(1.55rem, 6.2vw, 2.05rem);
  line-height: 1.25;
  margin: 0 0 14px;
  text-wrap: balance;
}
.hello em { font-style: italic; color: var(--gold); }
.body-text {
  font-size: 1.08rem;
  line-height: 1.6;
  margin: 0 0 24px;
  color: var(--text);
  text-wrap: pretty;
}
.open {
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 1.05rem;
  letter-spacing: .02em;
  color: #052a30;
  background: linear-gradient(120deg, var(--gold), #ffdf8e);
  border: 0;
  border-radius: 999px;
  padding: 14px 26px 14px 30px;
  display: inline-flex; align-items: center; gap: 12px;
  cursor: pointer;
  box-shadow: 0 10px 28px rgba(244,198,90,.35);
  transition: transform .2s ease, box-shadow .2s ease;
}
.open:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(244,198,90,.45); }
.open:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
.open .arr { display: inline-block; font-size: 1.3rem; line-height: 1; animation: nudge 1.4s ease-in-out infinite; }
@keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
@keyframes cardIn { from { opacity: 0; transform: translateY(24px) scale(.97); } to { opacity: 1; transform: none; } }

/* ---------- garden ---------- */
.garden { opacity: 0; pointer-events: none; transition: opacity 1s ease .2s; overflow: hidden; }
.garden.on { opacity: 1; pointer-events: auto; }
.sorry {
  position: absolute; left: 0; right: 0; top: max(16px, env(safe-area-inset-top, 0px));
  text-align: center;
  font-family: var(--font-display); font-style: italic; font-weight: 400;
  font-size: clamp(1.1rem, 4.4vw, 1.5rem);
  color: var(--muted);
  letter-spacing: .02em;
  opacity: 0;
}
.garden.on .sorry { animation: fadeUp 1.2s ease 2.2s both; }
.emblem {
  position: absolute; left: 50%; top: 11%;
  width: min(86vw, 380px);
  margin-left: calc(min(86vw, 380px) / -2);
}
.emblem svg { width: 100%; height: auto; display: block; overflow: visible; filter: drop-shadow(0 0 26px rgba(47,134,214,.5)); animation: sway 7s ease-in-out infinite; transform-origin: 50% 85%; }
.ft { transform-origin: 150px 200px; transform: rotate(var(--a)); }
.garden.on .ft { animation: fan 1.2s cubic-bezier(.2,.9,.3,1.15) both; animation-delay: calc(.5s + var(--d)); }
.garden.on .bd { animation: fadeUp .9s ease 1.4s both; }
@keyframes fan { from { transform: rotate(0deg) scale(.15); opacity: 0; } to { transform: rotate(var(--a)) scale(1); opacity: 1; } }
@keyframes sway { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

.hill { position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: linear-gradient(to top, #041a20 5%, rgba(4,26,32,0)); pointer-events: none; }
.fl, .fl-float { position: absolute; width: clamp(48px, calc(var(--s) * 1vw), 112px); aspect-ratio: 1; opacity: 0; transform: scale(0); }
.fl svg, .fl-float svg, .crit svg { width: 100%; height: 100%; display: block; overflow: visible; }
.fl { bottom: var(--b); left: calc(var(--x) * 1% - 5%); transform-origin: 50% 70%; }
.fl svg { animation: bob 5s ease-in-out infinite; animation-delay: var(--d); transform-origin: 50% 90%; }
.garden.on .fl, .garden.on .fl-float { animation: pop .95s cubic-bezier(.2,1.5,.4,1) both; animation-delay: calc(1s + var(--d)); }
.fl-float { left: calc(var(--x) * 1%); top: calc(var(--y) * 1%); width: clamp(26px, calc(var(--s) * 1vw), 60px); }
.fl-float svg { animation: drift 9s ease-in-out infinite; animation-delay: var(--d); }
@keyframes pop { from { transform: scale(0) rotate(-40deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes bob { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes drift { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-16px) rotate(18deg); } }

.crit { position: absolute; width: clamp(70px, 20vw, 120px); aspect-ratio: 1; padding: 0; border: 0; background: none; cursor: pointer; opacity: 0; transform: scale(0); z-index: 3; }
.garden.on .crit { animation: pop .9s cubic-bezier(.2,1.5,.4,1) both; animation-delay: calc(1.9s + var(--d)); }
.crit .in { width: 100%; height: 100%; animation: hop 3.2s ease-in-out infinite; animation-delay: var(--d); }
.crit.boing .in { animation: boing .7s ease; }
.crit:focus-visible { outline: 3px solid #fff; outline-offset: 4px; border-radius: 16px; }
@keyframes hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes boing { 0% { transform: scale(1); } 30% { transform: scale(1.25, .8); } 60% { transform: scale(.85, 1.2) translateY(-24px); } 100% { transform: scale(1); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .garden.on .fl, .garden.on .fl-float, .garden.on .crit, .garden.on .ft, .garden.on .sorry, .garden.on .bd { opacity: 1; transform: none; }
  .garden.on .ft { transform: rotate(var(--a)); }
}
</style>

<canvas id="bokeh" aria-hidden="true"></canvas>

<main class="layer intro" id="intro">
  <section class="card" role="dialog" aria-modal="true" aria-labelledby="hello">
    <svg class="feather" viewBox="0 0 64 64" aria-hidden="true">
      <defs><linearGradient id="cf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#25c2b0"/><stop offset="1" stop-color="#2f86d6"/></linearGradient></defs>
      <path d="M32 62 C31 46 31 34 32 14" stroke="#1fb5ac" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="32" cy="24" rx="15" ry="22" fill="url(#cf)"/>
      <ellipse cx="32" cy="21" rx="8" ry="12" fill="#f4c65a"/>
      <ellipse cx="32" cy="20" rx="4.6" ry="7" fill="#2f86d6"/>
      <ellipse cx="32" cy="18.5" rx="2" ry="3.4" fill="#05202a"/>
    </svg>
    <p class="hello" id="hello">Hi my pretty <em>peacock miraculous holder.</em></p>
    <p class="body-text">I'm extremely sorry for the things I did and said &amp; to apologise I'm sending you this,</p>
    <button class="open" id="open" type="button">Open <span class="arr" aria-hidden="true">&#8594;</span></button>
  </section>
</main>

<div class="layer garden" id="garden" aria-hidden="true">
  <div class="sorry">I'm sorry, Ryu.</div>
  <div class="emblem" id="emblem"></div>
  <div class="hill"></div>
  <div id="floaters"></div>
  <div id="bed"></div>
  <div id="crits"></div>
</div>

<script>
(function () {
  /* ---------- bokeh canvas ---------- */
  var cv = document.getElementById('bokeh');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, dpr = 1;
  var cool = ['#2fd6c9', '#3aa0ff', '#f4c65a', '#6ee7d8', '#8fb8ff', '#1fb5ac'];
  var warm = ['#ff9eb8', '#ffd27a', '#c7a8ff', '#ff8fa3', '#ffe08a', '#ffb3c8'];
  function rgb(h) { var n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var mix = 0, target = 0, dots = [];
  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function seed() {
    dots = [];
    var count = W < 600 ? 30 : 46;
    for (var i = 0; i < count; i++) {
      var k = i % 6;
      dots.push({
        x: Math.random() * W, y: Math.random() * H,
        r: 16 + Math.random() * 70,
        vy: -(0.08 + Math.random() * 0.28), vx: (Math.random() - .5) * .18,
        a: .10 + Math.random() * .22,
        c: rgb(cool[k]), w: rgb(warm[(k + i) % 6]),
        ph: Math.random() * 6.28
      });
    }
  }
  function frame(t) {
    mix += (target - mix) * 0.02;
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      if (!still) {
        d.x += d.vx; d.y += d.vy;
        if (d.y < -d.r) { d.y = H + d.r; d.x = Math.random() * W; }
        if (d.x < -d.r) d.x = W + d.r; if (d.x > W + d.r) d.x = -d.r;
      }
      var tw = still ? 1 : 0.8 + 0.2 * Math.sin(t / 1500 + d.ph);
      var col = [0, 1, 2].map(function (j) { return Math.round(d.c[j] + (d.w[j] - d.c[j]) * mix); }).join(',');
      var g = ctx.createRadialGradient(d.x, d.y, d.r * .1, d.x, d.y, d.r);
      g.addColorStop(0, 'rgba(' + col + ',' + (d.a * .45 * tw) + ')');
      g.addColorStop(.78, 'rgba(' + col + ',' + (d.a * .6 * tw) + ')');
      g.addColorStop(.94, 'rgba(' + col + ',' + (d.a * 1.1 * tw) + ')');
      g.addColorStop(1, 'rgba(' + col + ',0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.2832); ctx.fill();
    }
    if (!still) requestAnimationFrame(frame);
  }
  size(); seed();
  window.addEventListener('resize', function () { size(); seed(); if (still) frame(0); });
  if (still) frame(0); else requestAnimationFrame(frame);

  /* ---------- flowers ---------- */
  function flower(c1, c2, n) {
    var p = '';
    for (var i = 0; i < n; i++) {
      p += '<ellipse cx="50" cy="27" rx="13" ry="23" fill="' + c1 + '" fill-opacity=".93" stroke="rgba(255,255,255,.4)" stroke-width="1" transform="rotate(' + (i * 360 / n) + ' 50 50)"/>';
    }
    return '<svg viewBox="0 0 100 100" aria-hidden="true">' + p +
      '<circle cx="50" cy="50" r="12.5" fill="' + c2 + '"/><circle cx="46" cy="46" r="4" fill="#fff" fill-opacity=".55"/></svg>';
  }
  var bedData = [
    [3, -2, 19, '#ff9eb8', '#f4c65a', 8, .0], [14, -10, 24, '#c7a8ff', '#fff1b8', 7, .12], [26, 4, 17, '#ffd27a', '#ff8fa3', 9, .24],
    [39, -14, 26, '#ff8fa3', '#ffe08a', 6, .08], [53, 2, 18, '#9ee7de', '#f4c65a', 8, .30], [65, -12, 25, '#ffb3c8', '#f4c65a', 7, .18],
    [78, 2, 17, '#c7a8ff', '#fff1b8', 8, .36], [90, -8, 22, '#ff9eb8', '#ffe08a', 9, .06]
  ];
  document.getElementById('bed').innerHTML = bedData.map(function (f) {
    return '<div class="fl" style="--x:' + f[0] + ';--b:' + f[1] + 'px;--s:' + f[2] + ';--d:' + f[6] + 's">' + flower(f[3], f[4], f[5]) + '</div>';
  }).join('');
  var floatData = [
    [6, 16, 8, '#ffd27a', '#ff8fa3', 6, .0], [84, 12, 9, '#c7a8ff', '#fff1b8', 7, .6], [10, 46, 7, '#ffb3c8', '#f4c65a', 8, 1.2],
    [86, 44, 7, '#9ee7de', '#f4c65a', 6, 1.8], [72, 27, 6, '#ff9eb8', '#ffe08a', 7, .9], [20, 29, 6, '#ffe08a', '#ff8fa3', 8, 1.5]
  ];
  document.getElementById('floaters').innerHTML = floatData.map(function (f) {
    return '<div class="fl-float" style="--x:' + f[0] + ';--y:' + f[1] + ';--s:' + f[2] + ';--d:' + f[6] + 's">' + flower(f[3], f[4], f[5]) + '</div>';
  }).join('');

  /* ---------- peacock emblem ---------- */
  var angles = [-72, -54, -36, -18, 0, 18, 36, 54, 72], fe = '';
  angles.forEach(function (a, i) {
    fe += '<g class="ft" style="--a:' + a + 'deg;--d:' + (Math.abs(a) / 72 * 0.5).toFixed(2) + 's">' +
      '<path d="M150 200 L150 80" stroke="#13908a" stroke-width="2.4" stroke-linecap="round"/>' +
      '<ellipse cx="150" cy="72" rx="21" ry="37" fill="url(#fth)" stroke="rgba(255,255,255,.35)" stroke-width="1"/>' +
      '<ellipse cx="150" cy="66" rx="11" ry="18" fill="#f4c65a"/>' +
      '<ellipse cx="150" cy="64" rx="6.5" ry="11" fill="#2f86d6"/>' +
      '<ellipse cx="150" cy="62" rx="2.6" ry="4.8" fill="#05202a"/></g>';
  });
  document.getElementById('emblem').innerHTML =
    '<svg viewBox="-30 0 360 250" aria-label="Peacock emblem" role="img"><defs>' +
    '<linearGradient id="fth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2fd6c9"/><stop offset="1" stop-color="#2468b8"/></linearGradient>' +
    '<linearGradient id="bdy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fd6c9"/><stop offset="1" stop-color="#1b6fb8"/></linearGradient></defs>' +
    fe +
    '<g class="bd"><ellipse cx="150" cy="214" rx="27" ry="25" fill="url(#bdy)" stroke="rgba(255,255,255,.4)" stroke-width="1"/>' +
    '<circle cx="150" cy="184" r="15" fill="url(#bdy)" stroke="rgba(255,255,255,.4)" stroke-width="1"/>' +
    '<path d="M150 170 L150 156 M143 171 L138 159 M157 171 L162 159" stroke="#f4c65a" stroke-width="2" stroke-linecap="round"/>' +
    '<circle cx="150" cy="155" r="3" fill="#f4c65a"/><circle cx="137.500" cy="158" r="2.600" fill="#f4c65a"/><circle cx="162.500" cy="158" r="2.600" fill="#f4c65a"/>' +
    '<circle cx="144.500" cy="183" r="2.200" fill="#05202a"/><circle cx="155.500" cy="183" r="2.200" fill="#05202a"/>' +
    '<path d="M147 189 L153 189 L150 195 Z" fill="#f4c65a"/>' +
    '<path d="M140 218 C 146 232, 154 232, 160 218" stroke="rgba(255,255,255,.45)" stroke-width="1.5" fill="none" stroke-linecap="round"/></g></svg>';

  /* ---------- little characters (original) ---------- */
  var bunny = '<svg viewBox="0 0 100 100" aria-hidden="true">' +
    '<ellipse cx="34" cy="22" rx="9" ry="20" fill="#ffe3ec"/><ellipse cx="66" cy="22" rx="9" ry="20" fill="#ffe3ec"/>' +
    '<ellipse cx="34" cy="24" rx="4" ry="13" fill="#ffb3c8"/><ellipse cx="66" cy="24" rx="4" ry="13" fill="#ffb3c8"/>' +
    '<ellipse cx="50" cy="64" rx="34" ry="30" fill="#ffe3ec"/>' +
    '<circle cx="39" cy="60" r="3.600" fill="#3a1f2b"/><circle cx="61" cy="60" r="3.600" fill="#3a1f2b"/>' +
    '<circle cx="40.200" cy="58.800" r="1.200" fill="#fff"/><circle cx="62.200" cy="58.800" r="1.200" fill="#fff"/>' +
    '<ellipse cx="30" cy="70" rx="6" ry="4" fill="#ff9eb8" fill-opacity=".7"/><ellipse cx="70" cy="70" rx="6" ry="4" fill="#ff9eb8" fill-opacity=".7"/>' +
    '<path d="M44 70 Q50 77 56 70" stroke="#3a1f2b" stroke-width="2.400" fill="none" stroke-linecap="round"/>' +
    '<circle cx="34" cy="41" r="5" fill="#c7a8ff"/><circle cx="46" cy="38" r="5" fill="#f4c65a"/><circle cx="58" cy="38" r="5" fill="#ff8fa3"/><circle cx="68" cy="42" r="5" fill="#9ee7de"/></svg>';
  var bee = '<svg viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="beeclip"><ellipse cx="50" cy="60" rx="32" ry="28"/></clipPath></defs>' +
    '<ellipse cx="30" cy="30" rx="15" ry="11" fill="#d9f6f2" fill-opacity=".85" transform="rotate(-25 30 30)"/>' +
    '<ellipse cx="70" cy="30" rx="15" ry="11" fill="#d9f6f2" fill-opacity=".85" transform="rotate(25 70 30)"/>' +
    '<ellipse cx="50" cy="60" rx="32" ry="28" fill="#f4c65a"/>' +
    '<g clip-path="url(#beeclip)"><rect x="14" y="68" width="72" height="9" fill="#4a3516"/><rect x="14" y="82" width="72" height="9" fill="#4a3516"/></g>' +
    '<circle cx="40" cy="52" r="3.600" fill="#2a1d0a"/><circle cx="60" cy="52" r="3.600" fill="#2a1d0a"/>' +
    '<circle cx="41.200" cy="50.800" r="1.200" fill="#fff"/><circle cx="61.200" cy="50.800" r="1.200" fill="#fff"/>' +
    '<ellipse cx="31" cy="60" rx="5" ry="3.400" fill="#ff9eb8" fill-opacity=".75"/><ellipse cx="69" cy="60" rx="5" ry="3.400" fill="#ff9eb8" fill-opacity=".75"/>' +
    '<path d="M44 60 Q50 66 56 60" stroke="#2a1d0a" stroke-width="2.400" fill="none" stroke-linecap="round"/>' +
    '<path d="M42 33 Q38 22 32 20 M58 33 Q62 22 68 20" stroke="#4a3516" stroke-width="2.400" fill="none" stroke-linecap="round"/><circle cx="32" cy="20" r="2.800" fill="#4a3516"/><circle cx="68" cy="20" r="2.800" fill="#4a3516"/></svg>';
  var chick = '<svg viewBox="0 0 100 100" aria-hidden="true">' +
    '<g transform="translate(50 74)"><ellipse rx="9" ry="22" fill="#1b9aa0" transform="rotate(-50) translate(0 -26)"/><ellipse rx="9" ry="22" fill="#2468b8" transform="rotate(0) translate(0 -30)"/><ellipse rx="9" ry="22" fill="#1b9aa0" transform="rotate(50) translate(0 -26)"/></g>' +
    '<circle cx="50" cy="62" r="28" fill="#2fd6c9"/>' +
    '<path d="M50 36 L50 24 M42 37 L36 27 M58 37 L64 27" stroke="#f4c65a" stroke-width="2.400" stroke-linecap="round"/>' +
    '<circle cx="50" cy="22" r="3.200" fill="#f4c65a"/><circle cx="35" cy="25" r="2.800" fill="#f4c65a"/><circle cx="65" cy="25" r="2.800" fill="#f4c65a"/>' +
    '<circle cx="40" cy="58" r="3.600" fill="#05202a"/><circle cx="60" cy="58" r="3.600" fill="#05202a"/>' +
    '<circle cx="41.200" cy="56.800" r="1.200" fill="#fff"/><circle cx="61.200" cy="56.800" r="1.200" fill="#fff"/>' +
    '<ellipse cx="31" cy="67" rx="5" ry="3.400" fill="#ff9eb8" fill-opacity=".75"/><ellipse cx="69" cy="67" rx="5" ry="3.400" fill="#ff9eb8" fill-opacity=".75"/>' +
    '<path d="M45 64 L55 64 L50 72 Z" fill="#f4c65a"/></svg>';
  var critData = [
    ['Bunny', bunny, 'left:3%;bottom:11%', 0], ['Bee', bee, 'left:50%;margin-left:clamp(-35px,-10vw,-60px);bottom:30%', .35], ['Peacock chick', chick, 'right:3%;bottom:11%', .7]
  ];
  var critsEl = document.getElementById('crits');
  critsEl.innerHTML = critData.map(function (c) {
    return '<button type="button" class="crit" aria-label="' + c[0] + '" style="' + c[2] + ';--d:' + c[3] + 's"><div class="in">' + c[1] + '</div></button>';
  }).join('');
  critsEl.addEventListener('click', function (e) {
    var b = e.target.closest('.crit'); if (!b) return;
    b.classList.remove('boing'); void b.offsetWidth; b.classList.add('boing');
  });

  /* ---------- reveal ---------- */
  var intro = document.getElementById('intro');
  var garden = document.getElementById('garden');
  document.getElementById('open').addEventListener('click', function () {
    intro.classList.add('gone');
